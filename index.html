<!doctype html>
<html lang="vi" class="invitation-locked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b0ccde" />
    <title>Lễ Tốt Nghiệp | Triệu Quang Sáng</title>
    <meta
      name="description"
      content="Thiệp mời tốt nghiệp Triệu Quang Sáng - Trường Đại học Công nghệ Đông Á."
    />

    <link rel="stylesheet" href="/src/intro-refresh.css" />
    <link rel="stylesheet" href="/src/invitation-refresh.css" />

    <style>
      html.invitation-locked,
      body.invitation-locked {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        overscroll-behavior: none;
      }

      body.invitation-locked main > section:not(#intro),
      body.invitation-locked .floating-nav,
      body.invitation-locked .music-float,
      body.invitation-locked .site-header .nav,
      body.invitation-locked .site-header .menu-btn {
        display: none !important;
      }

      body.invitation-locked #intro {
        min-height: 100svh;
      }

      #details .detail-module {
        min-height: 280px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
      }

      #details .detail-primary-title {
        max-width: 100%;
        margin: 14px 0 0;
        color: var(--blue-dark);
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: clamp(25px, 2.7vw, 38px);
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.025em;
        overflow-wrap: anywhere;
      }

      #details .detail-primary-title a {
        color: inherit;
        font-weight: inherit;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
      }

      @media (max-width: 760px) {
        #details .detail-module {
          min-height: 240px;
        }

        #details .detail-primary-title {
          font-size: clamp(27px, 8vw, 36px);
        }
      }
    </style>
  </head>
  <body class="invitation-locked">
    <div id="root"></div>

    <script>
      (() => {
        let unlocked = false;

        const unlockInvitation = (event) => {
          const trigger = event.target.closest?.(".envelope-stage");
          if (!trigger || unlocked) return;

          unlocked = true;
          document.documentElement.classList.remove("invitation-locked");
          document.body.classList.remove("invitation-locked");

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              document
                .querySelector("#invitation")
                ?.scrollIntoView({ behavior: "smooth", block: "start" });
            });
          });
        };

        document.addEventListener("click", unlockInvitation);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/invitation-refresh.js"></script>
    <script type="module" src="/src/details-refresh.js"></script>
  </body>
</html>
