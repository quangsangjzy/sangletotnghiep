<!doctype html>
<html lang="vi" class="invitation-locked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b0ccde" />
    <title>Lễ Tốt Nghiệp | Triệu Quang Sáng</title>
    <meta
      name="description"
      content="Thiệp mời tốt nghiệp Triệu Quang Sáng - Trường Đại học Công nghệ Đông Á."
    />

    <link rel="stylesheet" href="/src/intro-refresh.css" />
    <link rel="stylesheet" href="/src/invitation-refresh.css" />

    <style>
      /*
       * Intro gate: trước khi người xem bấm vào phong bì, trang chỉ hiển thị
       * phần header thương hiệu và intro. Nội dung phía dưới chưa thể cuộn tới,
       * chưa thể truy cập bằng menu hoặc điều hướng nhanh.
       */
      html.invitation-locked,
      body.invitation-locked {
        width: 100%;
        height: 100%;
        overflow: hidden !important;
        overscroll-behavior: none;
      }

      body.invitation-locked main > section:not(#intro),
      body.invitation-locked .floating-nav,
      body.invitation-locked .music-float,
      body.invitation-locked .site-header .nav,
      body.invitation-locked .site-header .menu-btn {
        display: none !important;
      }

      body.invitation-locked #intro {
        min-height: 100svh;
      }
    </style>
  </head>
  <body class="invitation-locked">
    <div id="root"></div>

    <script>
      (() => {
        let unlocked = false;

        const unlockInvitation = (event) => {
          const trigger = event.target.closest?.(".envelope-stage");
          if (!trigger || unlocked) return;

          unlocked = true;
          document.documentElement.classList.remove("invitation-locked");
          document.body.classList.remove("invitation-locked");

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              document
                .querySelector("#invitation")
                ?.scrollIntoView({ behavior: "smooth", block: "start" });
            });
          });
        };

        document.addEventListener("click", unlockInvitation);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/invitation-refresh.js"></script>
  </body>
</html>
